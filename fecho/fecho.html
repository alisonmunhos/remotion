<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Caveat';font-weight:700;src:url('../frames_teste/fonts/caveat-latin-700.woff2') format('woff2');}
:root{
	--escuro:#141414;
	--creme:#EEE9E1;
	--coral:#FF5F45;
	--ocre:#C9A26B;
}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#1d1c1f;}
#bg{position:absolute;inset:0;background:url('bg.png') center/cover;}
#grid{position:absolute;inset:0;
	background-image:
		linear-gradient(to right, rgba(238,233,225,.05) 2px, transparent 2px),
		linear-gradient(to bottom, rgba(238,233,225,.05) 2px, transparent 2px);
	background-size:90px 90px;background-position:45px 0;
	-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%, #000 30%, transparent 100%);}
#stage{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 40%;}
.card{position:absolute;left:50%;top:0;transform-style:preserve-3d;}
.paper{background:var(--creme);border-radius:22px;position:relative;
	box-shadow:0 40px 70px rgba(20,20,20,.75), 0 6px 14px rgba(20,20,20,.6);}
svg{display:block;overflow:visible}
#caption{position:absolute;left:0;right:0;top:1490px;display:flex;justify-content:center;}
#pill{background:rgba(20,20,20,.88);border-radius:20px;padding:18px 34px 22px;
	font-family:Inter;font-weight:800;font-size:58px;letter-spacing:-1px;color:var(--creme);white-space:nowrap;}
#pill span{display:inline-block;margin-right:.26em}
#pill span:last-child{margin-right:0}
#pill .hi{color:var(--coral)}
#fly{position:absolute;inset:0;}
</style>
</head>
<body>
<div id="bg"></div>
<div id="grid"></div>
<div id="stage">
	<!-- Cartão 1: balão de fala com ✓, riscado, lupa -->
	<div class="card" id="c1" style="width:640px;height:700px;margin-left:-320px;top:470px">
		<div class="paper" style="width:640px;height:700px">
			<svg width="640" height="700" viewBox="0 0 640 700">
				<defs>
					<filter id="boil1" x="-10%" y="-10%" width="120%" height="120%">
						<feTurbulence id="turb1" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1"/>
						<feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
					</filter>
					<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
						<line x1="0" y1="0" x2="0" y2="14" stroke="#141414" stroke-width="2.5" stroke-opacity=".5"/>
					</pattern>
				</defs>
				<text x="44" y="70" style="font-family:'JetBrains Mono';font-weight:700;font-size:24px;letter-spacing:5px" fill="#141414" fill-opacity=".55">— CONFIA?</text>
				<g filter="url(#boil1)">
					<!-- balão -->
					<path id="bubble" d="M110,130 H530 Q570,130 570,170 V400 Q570,440 530,440 H260 L190,520 L205,440 H110 Q70,440 70,400 V170 Q70,130 110,130 Z"
						fill="#EEE9E1" stroke="#141414" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
					<!-- narrador -->
					<g id="narr">
						<path d="M70,690 V640 Q70,590 125,590 H155 Q210,590 210,640 V690" fill="url(#hatch)" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
						<circle cx="140" cy="545" r="38" fill="#EEE9E1" stroke="#141414" stroke-width="6"/>
					</g>
				</g>
				<!-- ✓ desenhado -->
				<path id="check" d="M215,290 L290,365 L440,205" fill="none" stroke="#FF5F45" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
				<!-- rabisco por cima -->
				<path id="scribble" d="M190,250 L470,215 L180,300 L475,270 L190,350 L465,330 L205,395" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
				<!-- anotação -->
				<text id="note" x="600" y="585" text-anchor="end" style="font-family:Caveat;font-weight:700;font-size:78px" fill="#FF5F45" opacity="0" transform="rotate(-6 600 585)">confira!</text>
			</svg>
			<!-- lupa (fora do filtro, por cima) -->
			<svg id="lupa" width="320" height="320" viewBox="0 0 320 320" style="position:absolute;left:0;top:0;opacity:0">
				<circle cx="120" cy="120" r="92" fill="#EEE9E1" fill-opacity=".35" stroke="#141414" stroke-width="12"/>
				<path d="M70,85 Q90,55 125,50" fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round" stroke-opacity=".6"/>
				<path d="M188,188 L290,290" stroke="#141414" stroke-width="34" stroke-linecap="round"/>
				<path d="M188,188 L210,210" stroke="#141414" stroke-width="16" stroke-linecap="round"/>
			</svg>
		</div>
	</div>

	<!-- Cartão 2: campo de comentário -->
	<div class="card" id="c2" style="width:820px;height:360px;margin-left:-410px;top:640px">
		<div class="paper" style="width:820px;height:360px">
			<svg width="820" height="360" viewBox="0 0 820 360">
				<defs>
					<filter id="boil2" x="-10%" y="-10%" width="120%" height="120%">
						<feTurbulence id="turb2" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1"/>
						<feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
					</filter>
				</defs>
				<text x="44" y="70" style="font-family:'JetBrains Mono';font-weight:700;font-size:24px;letter-spacing:5px" fill="#141414" fill-opacity=".55">— COMENTÁRIOS</text>
				<g filter="url(#boil2)">
					<circle cx="100" cy="210" r="42" fill="#EEE9E1" stroke="#141414" stroke-width="6"/>
					<circle cx="100" cy="196" r="13" fill="#141414"/>
					<path d="M76,236 Q100,212 124,236" fill="#141414"/>
					<rect x="168" y="160" width="452" height="100" rx="50" fill="#EEE9E1" stroke="#141414" stroke-width="6"/>
				</g>
				<text id="ph" x="212" y="223" style="font-family:Inter;font-weight:500;font-size:36px" fill="#141414" fill-opacity=".4">Comentar…</text>
				<text id="typed" x="212" y="232" style="font-family:Inter;font-weight:900;font-size:58px;letter-spacing:2px" fill="#141414"></text>
				<rect id="caret" x="212" y="182" width="6" height="60" fill="#FF5F45"/>
				<path id="uline" d="M210,252 C270,246 330,248 400,244" fill="none" stroke="#FF5F45" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
				<!-- botão enviar com a seta da marca -->
				<g id="btn" transform="translate(712 210)">
					<circle r="62" fill="#FF5F45"/>
					<g id="btnArrow" transform="rotate(-147.8)">
						<path d="M-30,0 H28 M28,0 L6,-20 M28,0 L6,20" fill="none" stroke="#EEE9E1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
					</g>
				</g>
			</svg>
		</div>
	</div>
</div>

<!-- seta voando até a crase -->
<svg id="fly" width="1080" height="1920" viewBox="0 0 1080 1920">
	<path id="trail" fill="none" stroke="#FF5F45" stroke-width="9" stroke-linecap="round" stroke-dasharray="0.1 26" opacity="0"/>
	<g id="arrow" opacity="0">
		<path id="arrowPath" fill="none" stroke="#FF5F45" stroke-linecap="round" stroke-linejoin="round"/>
	</g>
	<circle id="ring" fill="none" stroke="#FF5F45" stroke-width="6" opacity="0"/>
</svg>

<div id="caption"><div id="pill"></div></div>

<script>
// tempos das palavras no áudio do fecho (s)
const LINES = [
	{from: 0.10, to: 1.25, words: [['Você',0.15],['pode',0.35],['acreditar',0.49,1],['em',0.83],['mim,',0.91]]},
	{from: 1.28, to: 2.08, words: [['mas',1.33],['não',1.45,1],['precisa.',1.53,1]]},
	{from: 2.14, to: 3.08, words: [['Comenta',2.19],['FONTE',2.55,1]]},
	{from: 3.08, to: 3.42, words: [['que',2.91],['eu',2.95],['te',3.03],['mando',3.15]]},
	{from: 3.42, to: 4.34, words: [['tudinho',3.43],['no',3.81],['direct.',3.91,1]]},
];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=(x)=>1-Math.pow(1-x,3);            // ease-out cúbico
const eio=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=(x)=>{const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const $=(id)=>document.getElementById(id);
const lerp=(a,b,u)=>a+(b-a)*u;
const CRASE={x:401.5,y:858.5,len:32,ang:-147.8};   // posição da crase no 1º quadro em que ela surge no mp4 da marca
const START={x:842,y:852};

function arrowD(len, head){
	// seta apontando para +x, centrada; head = tamanho das hastes da ponta
	const h=len/2;
	let d=`M${-h},0 H${h}`;
	if(head>0.5) d+=` M${h},0 L${h-head*.78},${-head*.72} M${h},0 L${h-head*.78},${head*.72}`;
	return d;
}

window.render = function(t){
	const boil = Math.floor(t*8);  // traço "vivo" a 8 quadros/s
	$('turb1').setAttribute('seed', 1+boil%5);
	$('turb2').setAttribute('seed', 3+boil%5);

	// fundo: grade some no final, para emendar com o 1º quadro da marca
	$('grid').style.opacity = 1-lin(t,3.95,4.4);

	// ---------- cartão 1 ----------
	const in1 = eo(lin(t,0,0.42));
	const out1 = eio(lin(t,1.92,2.3));
	const c1 = $('c1');
	c1.style.opacity = t<2.35?1:0;
	const x1 = lerp(820,0,in1) + lerp(0,-1050,out1);
	const ry1 = lerp(-28,-7,in1) + lerp(0,24,out1) + 3*Math.sin(t*1.3);
	const rx1 = 12 - 2*lin(t,0,2);
	const z1 = -60 + 40*lin(t,0,1.9);
	c1.style.transform = `translate3d(${x1}px,0,${z1}px) scale(1.12) rotateX(${rx1}deg) rotateY(${ry1}deg) rotateZ(${lerp(4,-2,in1)}deg)`;
	c1.style.filter = `blur(${(out1*10 + (1-in1)*6).toFixed(2)}px)`;
	$('check').style.strokeDashoffset = 1-eo(lin(t,0.47,0.8));
	$('scribble').style.strokeDashoffset = 1-lin(t,1.30,1.58);
	// lupa entra em "precisa"
	const lp = eback(lin(t,1.50,1.82));
	const lupa=$('lupa');
	lupa.style.opacity = lin(t,1.5,1.6);
	lupa.style.transform = `translate(${lerp(560,250,lp)}px,${lerp(640,190,lp)}px) rotate(${lerp(25,-8,lp)}deg) scale(${lerp(.6,1,lp)})`;
	$('note').setAttribute('opacity', lin(t,1.62,1.74));
	$('note').setAttribute('transform', `rotate(-6 600 585) translate(0 ${(1-eo(lin(t,1.62,1.8)))*14})`);

	// ---------- cartão 2 ----------
	const in2 = eo(lin(t,1.98,2.42));
	const out2 = eio(lin(t,3.42,3.86));
	const c2=$('c2');
	c2.style.opacity = (t>1.95 && t<3.9)?1:0;
	const x2 = lerp(900,0,in2) + lerp(0,-1150,out2);
	const ry2 = lerp(-30,-5,in2) + lerp(0,26,out2) + 2*Math.sin(t*1.4);
	c2.style.transform = `translate3d(${x2}px,0,0) rotateX(10deg) rotateY(${ry2}deg) rotateZ(${lerp(3,-1.5,in2)}deg)`;
	c2.style.filter = `blur(${(out2*12 + (1-in2)*6).toFixed(2)}px)`;
	const word='FONTE';
	const n = Math.floor(clamp((t-2.56)/0.05,0,5));
	$('typed').textContent = word.slice(0,n);
	$('ph').setAttribute('opacity', t<2.55?1:0);
	const tw = n? $('typed').getComputedTextLength():0;
	$('caret').setAttribute('x', 212+tw+8);
	$('caret').setAttribute('opacity', (n<5 || Math.floor(t*4)%2===0)?1:0);
	$('uline').style.strokeDashoffset = 1-eo(lin(t,2.88,3.12));
	// botão: aperta em "mando"
	const press = lin(t,3.12,3.2)-lin(t,3.2,3.32);
	$('btn').setAttribute('transform', `translate(712 210) scale(${1-0.12*press})`);
	$('btnArrow').setAttribute('opacity', t<3.3?1:0);

	// ---------- seta voando ----------
	const fly=$('arrow');
	if(t<3.42){const r=document.querySelector('#btn circle').getBoundingClientRect();START.x=r.left+r.width/2;START.y=r.top+r.height/2;}
	if(t>=3.3){
		const u = eio(lin(t,3.3,4.12));
		// bezier quadrática: desce e sobe para a esquerda, chega apontando para cima-esquerda
		const P0=START, P1={x:650,y:1180}, P2=CRASE;
		const bx=(s)=>(1-s)*(1-s)*P0.x+2*(1-s)*s*P1.x+s*s*P2.x;
		const by=(s)=>(1-s)*(1-s)*P0.y+2*(1-s)*s*P1.y+s*s*P2.y;
		const x=bx(u), y=by(u);
		const pop = eback(lin(t,3.3,3.48));
		const shrink = eio(lin(t,3.95,4.3));
		const len = lerp(lerp(58,130,pop),CRASE.len,shrink);
		const head = lerp(lerp(20,44,pop),0,eio(lin(t,4.02,4.3)));
		const sw = lerp(lerp(14,24,pop),9,shrink);
		$('arrowPath').setAttribute('d', arrowD(len,head));
		$('arrowPath').setAttribute('stroke-width', sw);
		fly.setAttribute('transform', `translate(${x} ${y}) rotate(${CRASE.ang})`);
		fly.setAttribute('opacity', 1-lin(t,4.38,4.5));
		// rastro pontilhado
		let d=`M${P0.x},${P0.y}`;
		const s0=Math.max(0,u-0.45);
		d=`M${bx(s0)},${by(s0)}`;
		for(let i=1;i<=24;i++){const s=s0+(u-s0)*i/24;d+=` L${bx(s).toFixed(1)},${by(s).toFixed(1)}`;}
		$('trail').setAttribute('d', d);
		$('trail').setAttribute('opacity', (u<1? .85 : 0)*(1-lin(t,3.95,4.15)));
		// anel do clique
		const r = lin(t,3.22,3.55);
		$('ring').setAttribute('cx',START.x);$('ring').setAttribute('cy',START.y);
		$('ring').setAttribute('r', 70+90*eo(r));
		$('ring').setAttribute('opacity', r>0&&r<1 ? (1-r)*.9 : 0);
	} else {
		fly.setAttribute('opacity',0);
	}

	// ---------- legenda (palavra por palavra) ----------
	const pill=$('pill');
	const line = LINES.find(l=>t>=l.from && t<l.to);
	if(!line){pill.style.opacity=0;pill.innerHTML='';return;}
	pill.style.opacity=1;
	pill.innerHTML = line.words.map(([w,ws,hi])=>{
		const a = lin(t,ws-0.02,ws+0.08);
		if(t<ws-0.02) return '';
		return `<span class="${hi?'hi':''}" style="opacity:${a};transform:translateY(${(1-a)*10}px)">${w}</span>`;
	}).join('');
};
render(0);
</script>
</body>
</html>
